services:
  postgres:
    image: postgres:15
    container_name: infinite-ttt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infinite_ttt
    ports:
      - "5433:5432"
    volumes:
      - infinite_ttt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinite_ttt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: infinite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - infinite_ttt_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  infinite_ttt_postgres_data:
  infinite_ttt_redis_data:
