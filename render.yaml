services:
  - type: web
    name: infinite-ttt-backend
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @infinite-ttt/shared build && pnpm --filter @infinite-ttt/game-engine build && pnpm --filter @infinite-ttt/identity build && pnpm --filter @infinite-ttt/backend prisma:generate && pnpm --filter @infinite-ttt/backend build
    startCommand: pnpm --filter @infinite-ttt/backend prisma:migrate:deploy && pnpm --filter @infinite-ttt/backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WS_URL
        sync: false
